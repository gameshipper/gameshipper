# Publishes to npm and creates the GitHub release when a v* tag is pushed.
# npm uses trusted publishing (OIDC): no npm token is stored anywhere.
# Each job gets only the permissions it needs: the tests and `npm pack` run read-only, the publish job only
# gets an OIDC token (and never runs npm ci or the package's scripts), and only the last job can write releases.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  pack:
    name: Test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      # prepack builds dist/ first.
      - run: npm pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: gameshipper-*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
      # Node 24's own npm, without installing another: trusted publishing needs 11.5.1 or newer.
      - name: Check npm supports trusted publishing
        run: |
          version="$(npm --version)"
          printf '%s\n' 11.5.1 "$version" | sort --version-sort --check=quiet || { echo "npm $version is older than 11.5.1"; exit 1; }
      - name: Publish the tested package
        run: npm publish gameshipper-*.tgz --access public

  github-release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
